name: Lyric Island final reviewed patch
on:
  push:
    branches: [chatgpt/redesign-performance-safe-20261018]
    paths: [.github/workflows/lyric-finalize-once.yml]
permissions:
  contents: write
concurrency:
  group: lyric-island-final-reviewed-patch
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: macos-15
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Apply only the hash-verified reviewed files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/lyric-final-result
          python3 - <<'PY'
          import urllib.request,base64,lzma,json,pathlib,hashlib,os,subprocess
          assert os.environ['GITHUB_REPOSITORY']=='suifracti/lyricsQ'
          assert os.environ['GITHUB_REF']=='refs/heads/chatgpt/redesign-performance-safe-20261018'
          sha='2e04802062e64bf823a7964ec98d061122cb5968'
          req=urllib.request.Request('https://api.github.com/repos/suifracti/lyricsQ/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as response:item=json.load(response)
          raw=base64.b64decode(item['content'])
          assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==sha
          manifest=json.loads(lzma.decompress(raw));paths=[]
          subprocess.run(['git','merge-base','--is-ancestor',manifest['source_base'],'HEAD'],check=True)
          allowed={'SpotifyLyrics/Views/Components/LyricIslandControls.swift',
                   'SpotifyLyrics/Views/MainWindow/AppleMusicImmersiveV3WindowView.swift',
                   'Tests/v3_redesign_contract.py','Tests/query_identity_contract.swift',
                   '.github/workflows/lyric-redesign-check.yml',
                   'docs/design/lyric-island/REDESIGN-V2-IMPLEMENTATION.md'}
          assert {entry['path'] for entry in manifest['files']}==allowed
          for entry in manifest['files']:
              path=pathlib.Path(entry['path']);content=path.read_bytes()
              assert hashlib.sha256(content).hexdigest()==entry['before'],str(path)
              lines=content.decode('utf-8').splitlines(keepends=True)
              for start,end,replacement in reversed(entry['ops']):lines[start:end]=[replacement]
              updated=''.join(lines).encode('utf-8')
              assert hashlib.sha256(updated).hexdigest()==entry['after'],str(path)
              if str(path).startswith('.github/'):
                  continue  # Workflow changes are performed separately via connector.
              path.write_bytes(updated);paths.append(str(path))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-f','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=ChatGPT','-c','user.email=noreply@openai.com','commit','-m',manifest['message']],check=True)
          subprocess.run(['git','push','origin','HEAD:chatgpt/redesign-performance-safe-20261018'],check=True)
          pathlib.Path('/tmp/lyric-final-result/SOURCE_SHA.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          pathlib.Path('/tmp/lyric-final-result/reviewed-files.json').write_text(json.dumps([{k:v for k,v in e.items() if k!='ops'} for e in manifest['files'] if not e['path'].startswith('.github/')],indent=2))
          PY
      - name: Native source and identity contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,json,pathlib
          root=pathlib.Path('/tmp/lyric-final-result');results={}
          commands={'edge':['python3','Tests/v3_edge_pointer_state_contract.py'],
                    'scenes':['python3','Tests/v3_redesign_contract.py'],
                    'publisher-parser':['python3','Tests/linkcore_parser_contract.py'],
                    'provider-config':['bash','Tests/provider_expansion_configuration_contract.sh'],
                    'query-identity':['bash','Tests/query_identity_contract.sh']}
          for name,command in commands.items():
              with (root/(name+'.log')).open('w') as log:
                  try:results[name]=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=130).returncode
                  except subprocess.TimeoutExpired:results[name]='TIMEOUT'
          (root/'contracts.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(0 if all(v==0 for v in results.values()) else 1)
          PY
      - name: Compile final native AppKit and SwiftUI source
        id: build
        continue-on-error: true
        shell: bash
        run: |
          xcodebuild -version > /tmp/lyric-final-result/xcode-version.txt
          xcodebuild -project SpotifyLyrics.xcodeproj -scheme SpotifyLyrics -configuration Debug CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O -derivedDataPath /tmp/lyric-final-derived build > /tmp/lyric-final-result/xcodebuild.log 2>&1
      - name: Save exact outcome without claiming desktop performance
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/lyric-final-result');root.mkdir(exist_ok=True)
          (root/'result.json').write_text(json.dumps({'native_build':os.environ['BUILD_RESULT'],'contracts':os.environ['CONTRACT_RESULT'],'user_mac_gui':'NOT_RUN','paired_cpu_memory':'NOT_RUN'},indent=2))
          log=root/'xcodebuild.log'
          if log.exists():(root/'errors.txt').write_text('\n'.join(l for l in log.read_text(errors='replace').splitlines() if 'error:' in l))
          (root/'production-tree.txt').write_text(subprocess.check_output(['git','ls-tree','-r','HEAD','SpotifyLyrics','SpotifyLyrics.xcodeproj','Tests'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyric-island-final-native-build
          path: /tmp/lyric-final-result/
          retention-days: 7
      - name: Require actual native build and regression success
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        run: test "$BUILD_RESULT" = success && test "$CONTRACT_RESULT" = success
