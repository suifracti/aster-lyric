name: Lyric Island isolated source check
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/redesign-performance-safe-20261018]
    paths: [.github/workflows/lyric-redesign-check.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Public catalog metadata only
        shell: bash
        run: |
          mkdir -p /tmp/catalog
          python3 - <<'PY'
          import urllib.request,json,re,pathlib
          root=pathlib.Path('/tmp/catalog')
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'LyricIsland-Compatibility/1.0'}),timeout=15) as r: return r.read(2500000).decode('utf-8')
          url='https://www.tunecore.co.jp/vf/web/_next/static/chunks/pages/artists-1307e5b1a3ff5f12.js'
          js=read(url)
          excerpts=[js[max(0,m.start()-130):m.end()+180] for m in re.finditer(r'keyword|searchText|searchWord|/api/|query:|query\.|artist[sA-Z_-]{0,18}|router\.',js)]
          (root/'routing.txt').write_text('\n\n'.join(excerpts[:130]))
          for i,url in enumerate(['https://www.tunecore.co.jp/artists?id=582402&lang=en','https://www.tunecore.co.jp/artists?id=1077427&lang=en','https://www.tunecore.co.jp/artists']):
              text=read(url)
              match=re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>',text,re.S)
              if match:
                  obj=json.loads(match.group(1))
                  def clean(x):
                      if isinstance(x,dict):return {k:('[REDACTED]' if re.search(r'lyric|token|session|secret',k,re.I) else clean(v)) for k,v in x.items()}
                      if isinstance(x,list):return [clean(v) for v in x[:60]]
                      return x
                  (root/(str(i)+'.json')).write_text(json.dumps(clean(obj),ensure_ascii=False,indent=2))
              else:(root/(str(i)+'.txt')).write_text('NO_NEXT_DATA')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-island-catalog-schema
          path: /tmp/catalog/
          retention-days: 2
