name: Lyric Island native source check
on:
  workflow_dispatch:
  push:
    branches: [main, chatgpt/redesign-performance-safe-20261018]
    paths:
      - 'SpotifyLyrics/**'
      - 'SpotifyLyrics.xcodeproj/**'
      - 'Tests/**'
      - '.github/workflows/lyric-redesign-check.yml'
permissions:
  contents: read
concurrency:
  group: lyric-island-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exactly the committed source
        shell: bash
        run: |
          mkdir -p /tmp/lyric-source
          git rev-parse HEAD > /tmp/lyric-source/SOURCE_SHA.txt
          git archive --format=zip HEAD > /tmp/lyric-source/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-island-committed-source
          path: /tmp/lyric-source/
          retention-days: 7
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native production logic contracts
        id: contracts
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p /tmp/lyric-native-result
          git rev-parse HEAD > /tmp/lyric-native-result/SOURCE_SHA.txt
          python3 - <<'PY'
          import subprocess,json,pathlib
          root=pathlib.Path('/tmp/lyric-native-result');results={}
          commands={'edge':['python3','Tests/v3_edge_pointer_state_contract.py'],
                    'scenes':['python3','Tests/v3_redesign_contract.py'],
                    'publisher-parser':['python3','Tests/linkcore_parser_contract.py'],
                    'provider-config':['bash','Tests/provider_expansion_configuration_contract.sh']}
          for name,command in commands.items():
              with (root/(name+'.log')).open('w') as log:
                  try:results[name]=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=130).returncode
                  except subprocess.TimeoutExpired:results[name]='TIMEOUT'
          (root/'contracts.json').write_text(json.dumps(results,indent=2))
          raise SystemExit(0 if all(v==0 for v in results.values()) else 1)
          PY
      - name: Compile the complete native app
        id: build
        continue-on-error: true
        shell: bash
        run: |
          xcodebuild -version > /tmp/lyric-native-result/xcode-version.txt
          xcodebuild -project SpotifyLyrics.xcodeproj -scheme SpotifyLyrics -configuration Debug CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O -derivedDataPath /tmp/lyric-native-derived build > /tmp/lyric-native-result/xcodebuild.log 2>&1
      - name: Record verification boundaries
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          root=pathlib.Path('/tmp/lyric-native-result');root.mkdir(exist_ok=True)
          (root/'result.json').write_text(json.dumps({'native_build':os.environ['BUILD_RESULT'],'contracts':os.environ['CONTRACT_RESULT'],'user_mac_gui':'NOT_RUN','paired_cpu_memory':'NOT_RUN'},indent=2))
          log=root/'xcodebuild.log'
          if log.exists():(root/'errors.txt').write_text('\n'.join(l for l in log.read_text(errors='replace').splitlines() if 'error:' in l))
          (root/'production-tree.txt').write_text(subprocess.check_output(['git','ls-tree','-r','HEAD','SpotifyLyrics','SpotifyLyrics.xcodeproj','Tests'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyric-island-native-build
          path: /tmp/lyric-native-result/
          retention-days: 7
      - name: Require real build and contract success
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        run: test "$BUILD_RESULT" = success && test "$CONTRACT_RESULT" = success
