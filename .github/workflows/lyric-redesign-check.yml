name: Lyric Island isolated source check
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/redesign-performance-safe-20261018]
    paths: [.github/workflows/lyric-redesign-check.yml]
permissions:
  contents: read
concurrency:
  group: lyric-island-isolated-native-check
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the exact committed source for continued work
        run: |
          mkdir -p /tmp/lyric-tracked-source
          git rev-parse HEAD > /tmp/lyric-tracked-source/SOURCE_SHA.txt
          git archive --format=zip HEAD -o /tmp/lyric-tracked-source/source.zip
          sha256sum /tmp/lyric-tracked-source/source.zip > /tmp/lyric-tracked-source/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-island-tracked-source
          path: /tmp/lyric-tracked-source/
          retention-days: 3
