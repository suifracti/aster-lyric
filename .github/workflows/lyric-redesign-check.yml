name: Lyric Island isolated source check
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/redesign-performance-safe-20261018]
    paths: [.github/workflows/lyric-redesign-check.yml]
permissions:
  contents: write
concurrency:
  group: lyric-island-isolated-native-check
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply the reviewed source delta with per-file identity verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/lyric-native-result
          python3 - <<'PY'
          import urllib.request,base64,lzma,json,pathlib,hashlib,os,subprocess
          blobs=['7b12d186ab4b40e1c9960e5d57608d0dcb60e3b5','93bf97fc3688959937e4215e8f32f733fb6539af']
          raw=b''
          for sha in blobs:
              req=urllib.request.Request('https://api.github.com/repos/suifracti/lyricsQ/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as r: item=json.load(r)
              data=base64.b64decode(item['content'])
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==sha
              raw+=data
          manifest=json.loads(lzma.decompress(raw))
          paths=[]
          for entry in manifest['files']:
              path=pathlib.Path(entry['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('SpotifyLyrics/','SpotifyLyrics.xcodeproj/','Tests/'))
              content=path.read_bytes() if path.exists() else b''
              actual=hashlib.sha256(content).hexdigest() if path.exists() else None
              assert actual==entry['before'], ('baseline mismatch',str(path),actual)
              lines=content.decode('utf-8').splitlines(keepends=True)
              for start,end,replacement in reversed(entry['ops']): lines[start:end]=[replacement]
              updated=''.join(lines).encode('utf-8')
              assert hashlib.sha256(updated).hexdigest()==entry['after'],('result mismatch',str(path))
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(updated);paths.append(str(path))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=ChatGPT','-c','user.email=noreply@openai.com','commit','-m','feat: integrate five scenes, external adjustment, artwork color and bounded menu lyrics'],check=True)
          subprocess.run(['git','push','origin','HEAD:chatgpt/redesign-performance-safe-20261018'],check=True)
          pathlib.Path('/tmp/lyric-native-result/SOURCE_SHA.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          pathlib.Path('/tmp/lyric-native-result/source-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Exact production edge-state contract
        id: edge
        continue-on-error: true
        run: python3 Tests/v3_edge_pointer_state_contract.py > /tmp/lyric-native-result/edge-contract.log 2>&1
      - name: Complete native AppKit and SwiftUI compilation
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -version > /tmp/lyric-native-result/xcode-version.txt
          xcodebuild -project SpotifyLyrics.xcodeproj -scheme SpotifyLyrics -configuration Debug CODE_SIGNING_ALLOWED=NO SWIFT_OPTIMIZATION_LEVEL=-O -derivedDataPath /tmp/lyric-native-derived build > /tmp/lyric-native-result/xcodebuild.log 2>&1
      - name: Record separate outcomes
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          EDGE_RESULT: ${{ steps.edge.outcome }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('/tmp/lyric-native-result');root.mkdir(exist_ok=True)
          (root/'result.json').write_text(json.dumps({'native_build':os.environ['BUILD_RESULT'],'edge_contract':os.environ['EDGE_RESULT'],'user_mac_gui':'NOT_RUN','paired_cpu_memory':'NOT_RUN'},indent=2))
          log=root/'xcodebuild.log'
          if log.exists():
              errors=[l for l in log.read_text(errors='replace').splitlines() if 'error:' in l]
              (root/'errors.txt').write_text('\n'.join(errors))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyric-island-native-build
          path: /tmp/lyric-native-result/
          retention-days: 3
      - name: Gate success on the actual native build
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          EDGE_RESULT: ${{ steps.edge.outcome }}
        run: test "$BUILD_RESULT" = success && test "$EDGE_RESULT" = success
